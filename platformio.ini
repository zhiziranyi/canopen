; STM32F407ZGT6 CANopen CiA402 FOC servo drive

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = stm32cube
monitor_speed = 115200

; Serial download through the STM32 ROM bootloader on COM3.
upload_protocol = serial
upload_speed = 115200
upload_port = COM3

lib_ldf_mode = off
build_type = release

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F407xx
    -DHSE_VALUE=8000000
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -O2
    ; Use the STM32F407 single-precision FPU while retaining the softfp ABI
    ; used by STM32Cube HAL and bundled CANopen objects.
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp
    -I include
    -I src
    -I lib/CANopenNode
    -I lib/CANopenNode/301
    -I lib/CO_STM32

; Treat warnings in project and bundled CANopen sources as errors without
; applying those flags to the separately built STM32 HAL framework package.
build_src_flags =
    -Wall
    -Wextra
    -Werror

build_src_filter =
    +<*.c>
    +<../lib/CANopenNode/301/*.c>
    +<../lib/CANopenNode/303/*.c>
    +<../lib/CANopenNode/CANopen.c>
    +<../lib/CO_STM32/*.c>

board_build.ldscript = ld/STM32F407ZGT6.ld
