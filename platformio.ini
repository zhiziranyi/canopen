; PlatformIO Project Configuration File
;
; CANopen CiA402 FOC 伺服驱动系统
; 芯片: STM32F407ZGT6 (black_f407zg, 1MB Flash / 128KB RAM)
;
; 参考: 开发参考方案.md（硬件接线与参数）

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = stm32cube
monitor_speed = 115200
upload_protocol = serial
upload_speed = 115200
; 串口烧录: BOOT0 拨到 1 上电进入 ROM bootloader，烧完拨回 0 复位
upload_port = COM3
lib_ldf_mode = off
build_type = release

; HSE_VALUE = 8MHz（与 cheji407 一致，板载晶振实测 8MHz）
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F407xx
    -DHSE_VALUE=8000000
    -ffunction-sections
    -fdata-sections
    -Wall
    -Wextra
    -Wl,--gc-sections
    -O2
    -I include
    -I src
    -I lib/CANopenNode
    -I lib/CANopenNode/301
    -I lib/CO_STM32

; 只把本项目 src/ 的警告升级为错误，避免第三方 HAL/CANopenNode 自带警告阻塞构建。
build_src_flags =
    -Werror

build_src_filter =
    +<*.c>
    +<../lib/CANopenNode/301/*.c>
    +<../lib/CANopenNode/303/*.c>
    +<../lib/CANopenNode/CANopen.c>
    +<../lib/CO_STM32/*.c>

board_build.ldscript = ld/STM32F407ZGT6.ld
